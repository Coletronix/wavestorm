[package]
name = "stormwaves-ui"
description = "egui application shell for Stormwaves"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
stormwaves-core.workspace = true
egui = { workspace = true, features = ["default_fonts"] }
eframe = { workspace = true, features = ["default_fonts"] }
serde.workspace = true
serde_json.workspace = true
image.workspace = true
hayro.workspace = true
log.workspace = true

rfd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "Event", "CssStyleDeclaration"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

[lints]
workspace = true
