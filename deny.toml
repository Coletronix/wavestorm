# cargo-deny configuration, checked in CI: `cargo deny check licenses sources`.

[licenses]
# Permissive licences only. Crates offering a choice (e.g. "Apache-2.0 OR GPL-2.0-only") pass on
# their permissive option. OFL-1.1 and Ubuntu-font-1.0 cover egui's bundled fonts.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
