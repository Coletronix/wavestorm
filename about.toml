# cargo-about configuration: third-party licence notices for binary releases.
# Generate with:
#   cargo about generate --locked -o THIRD-PARTY-LICENSES.html about.hbs

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

ignore-dev-dependencies = true
ignore-build-dependencies = true
# Skip crates with `publish = false`.
private = { ignore = true }

# The bundled egui fonts. The crate's licence files are not all picked up
# automatically, so list them explicitly. Hack-Regular.txt contains the Hack
# (MIT) notice plus the Bitstream Vera licence; the emoji-icon-font file is
# the MIT licence of John Slegers.
#
# The crate's declared licence is "(MIT OR Apache-2.0) AND OFL-1.1 AND
# Ubuntu-font-1.0". It is clarified to "MIT AND ..." (taking the MIT side of
# the dual licence) so that the MIT notices of the Hack and emoji-icon-font
# fonts are always emitted rather than being replaced by the generic Apache
# text.
[epaint_default_fonts.clarify]
license = "MIT AND OFL-1.1 AND Ubuntu-font-1.0"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"
license = "OFL-1.1"

[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"
license = "Ubuntu-font-1.0"

[[epaint_default_fonts.clarify.files]]
path = "fonts/Hack-Regular.txt"
checksum = "47c0cccbeec7e8614548cc485588b28149e7874188df5f41b36efebcee285c87"
license = "MIT"

[[epaint_default_fonts.clarify.files]]
path = "fonts/emoji-icon-font-mit-license.txt"
checksum = "b9d2c1d909aa149996fd4c91dcb92b2362a04431640c1d200959da94caf8cde1"
license = "MIT"
