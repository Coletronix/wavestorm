[package]
name = "wavestorm"
description = "WAVEStorm desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
wavestorm-ui.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }

# Debian package, built by the release workflow with `cargo deb -p wavestorm`.
[package.metadata.deb]
maintainer = "Coletronix <Coletronix@users.noreply.github.com>"
copyright = "WAVEStorm contributors"
extended-description = """\
Stormwater modelling: draw a routing diagram of subcatchments, reaches, ponds and links, \
compute NRCS TR-55/TR-20 runoff hydrographs and route them through channels, pipes, \
detention ponds and outlet structures."""
section = "science"
depends = "$auto"
recommends = "mesa-vulkan-drivers | libgl1"
assets = [
    ["target/release/wavestorm", "usr/bin/", "755"],
    ["wavestorm.desktop", "usr/share/applications/", "644"],
    ["../../crates/ui/assets/icon.png", "usr/share/icons/hicolor/512x512/apps/wavestorm.png", "644"],
    ["../../README.md", "usr/share/doc/wavestorm/README.md", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/wavestorm/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/wavestorm/", "644"],
    # Generated by the release workflow (cargo about).
    ["../../THIRD-PARTY-LICENSES.html", "usr/share/doc/wavestorm/", "644"],
]

[lints]
workspace = true
