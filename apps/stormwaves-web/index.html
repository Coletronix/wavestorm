<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Stormwaves</title>
  <link data-trunk rel="rust" data-bin="stormwaves-web" data-cargo-profile="wasm-release" data-wasm-opt="z" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d4d0c8; }
    #stormwaves_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #stormwaves_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #333; font: 15px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="stormwaves_canvas"></canvas>
  <div id="stormwaves_loading"><p>Loading Stormwaves&hellip;</p></div>
</body>
</html>
