[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/wavestorm"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Coletronix/wavestorm"
homepage = "https://github.com/Coletronix/wavestorm"

[workspace.dependencies]
wavestorm-core = { path = "crates/core" }
wavestorm-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
eframe = { version = "0.36", default-features = false }
egui = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "bmp",
  "gif",
  "webp",
  "tiff",
] }
hayro = "0.7"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
