# Builds the release packages and publishes a GitHub release when a version tag is pushed:
#   git tag -a vX.Y.Z -m "WAVEStorm X.Y.Z" -m "Optional highlights, shown at the top of the notes"
#   git push origin vX.Y.Z
# The tag must match `version` in Cargo.toml. Run it by hand (workflow_dispatch) to build the
# packages as workflow artifacts without publishing anything.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --locked -o THIRD-PARTY-LICENSES.html about.hbs
      # The font notices depend on checksummed files in about.toml; if egui updates them the
      # clarification stops applying silently, so check that they are still there.
      - run: |
          for notice in "Bitstream Vera" "Ubuntu Font Licence" "SIL OPEN FONT LICENSE" "John Slegers"; do
            grep -qi "$notice" THIRD-PARTY-LICENSES.html || { echo "::error::Missing font notice: $notice (update about.toml)"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: [version, ci, notices]
    # The oldest supported runner, so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - run: cargo build --release --locked -p wavestorm
      - name: Binary and tarball
        run: |
          mkdir -p out "wavestorm-$VERSION"
          cp target/release/wavestorm "out/wavestorm-$VERSION-x86_64-linux"
          cp target/release/wavestorm apps/wavestorm/wavestorm.desktop README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html "wavestorm-$VERSION/"
          cp crates/ui/assets/icon.png "wavestorm-$VERSION/wavestorm.png"
          tar -czf "out/wavestorm-$VERSION-x86_64-linux.tar.gz" "wavestorm-$VERSION"
      - name: Debian package
        run: cargo deb -p wavestorm --no-build --locked --deb-revision 1 -o "out/wavestorm_${VERSION}-1_amd64.deb"
      - name: AppImage
        run: |
          app=WAVEStorm.AppDir
          install -Dm755 target/release/wavestorm "$app/usr/bin/wavestorm"
          install -Dm644 apps/wavestorm/wavestorm.desktop "$app/usr/share/applications/wavestorm.desktop"
          install -Dm644 crates/ui/assets/icon.png "$app/usr/share/icons/hicolor/512x512/apps/wavestorm.png"
          install -Dm644 -t "$app/usr/share/doc/wavestorm" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html
          ln -s usr/share/applications/wavestorm.desktop "$app/wavestorm.desktop"
          ln -s usr/share/icons/hicolor/512x512/apps/wavestorm.png "$app/wavestorm.png"
          ln -s usr/bin/wavestorm "$app/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream "$app" "out/WAVEStorm-$VERSION-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows package
    needs: [version, ci, notices]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - run: cargo build --release --locked -p wavestorm
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, "wavestorm-$env:VERSION" | Out-Null
          Copy-Item target/release/wavestorm.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-LICENSES.html "wavestorm-$env:VERSION/"
          Compress-Archive -Path "wavestorm-$env:VERSION" -DestinationPath "out/wavestorm-$env:VERSION-x86_64-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS package
    needs: [version, ci, notices]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - run: |
          cargo build --release --locked -p wavestorm --target aarch64-apple-darwin
          cargo build --release --locked -p wavestorm --target x86_64-apple-darwin
      - name: App bundle and disk image
        run: |
          app=dmg/WAVEStorm.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" out
          lipo -create -output "$app/Contents/MacOS/wavestorm" \
            target/aarch64-apple-darwin/release/wavestorm target/x86_64-apple-darwin/release/wavestorm
          iconset=WAVEStorm.iconset
          mkdir "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s crates/ui/assets/icon.png --out "$iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s * 2)) $((s * 2)) crates/ui/assets/icon.png --out "$iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/wavestorm.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>WAVEStorm</string>
            <key>CFBundleDisplayName</key><string>WAVEStorm</string>
            <key>CFBundleIdentifier</key><string>io.github.coletronix.wavestorm</string>
            <key>CFBundleExecutable</key><string>wavestorm</string>
            <key>CFBundleIconFile</key><string>wavestorm</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html "$app/Contents/Resources/"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname WAVEStorm -srcfolder dmg -ov -format UDZO "out/WAVEStorm-$VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [version, notices, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # actions/checkout replaces annotated tags with lightweight ones; fetch the real tag
      # so its message can head the release notes.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and notes
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt)
          .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "WAVEStorm ${{ needs.version.outputs.version }}" --notes-file notes.md "${flags[@]}"
